name: Daily Bible Bot

on:
  schedule:
    # GitHub 무료 플랜의 크론 지연(2~4시간)을 감안해 이른 :17분 슬롯으로 3회 등록.
    # 아래 "Skip if already sent today" 스텝(last_sent.txt 기준)이 하루 1회만 발송되도록 보장한다.
    - cron: '17 19 * * *'  # KST 04:17
    - cron: '17 20 * * *'  # KST 05:17
    - cron: '17 21 * * *'  # KST 06:17
  workflow_dispatch:      # 수동 실행은 항상 즉시 발송

concurrency:
  group: daily-bible
  cancel-in-progress: false

jobs:
  send-bible-message:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Skip if already sent today (KST)
        id: check
        run: |
          TODAY=$(TZ=Asia/Seoul date +%F)
          LAST=$(cat last_sent.txt 2>/dev/null || echo none)
          echo "today=$TODAY last_sent=$LAST event=${{ github.event_name }}"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$LAST" = "$TODAY" ]; then
            echo "already_sent=true" >> "$GITHUB_OUTPUT"
            echo "Already sent today - skipping."
          else
            echo "already_sent=false" >> "$GITHUB_OUTPUT"
            echo "today=$TODAY" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.check.outputs.already_sent != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.check.outputs.already_sent != 'true'
        run: pip install requests

      - name: Run Bible Bot
        if: steps.check.outputs.already_sent != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py

      - name: Record last_sent
        if: steps.check.outputs.already_sent != 'true'
        run: |
          echo "${{ steps.check.outputs.today }}" > last_sent.txt
          git config user.name "daily-bible-bot"
          git config user.email "actions@users.noreply.github.com"
          git add last_sent.txt
          git commit -m "sent ${{ steps.check.outputs.today }}" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
